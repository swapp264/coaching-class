# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  # Option 1: Static Site (Recommended for Vite apps on Render - Free tier with global CDN)
  - type: static
    name: prabodha-academy
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

